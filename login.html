<!DOCTYPE html>
<html>
<head>
  <title>Login Form</title>
  <style>
    body {
      background-color: #3498db;
      color: #fff;
      font-family: sans-serif;
    }
    .container {
      width: 300px;
      background-color: #2c3e50;
      padding: 30px;
      margin: 50px auto;
      border-radius: 5px;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      background: #eee;
    }
    button {
      background-color: #3498db;
      color: #fff;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .register {
      color: #3498db;
      font-size: 14px;
    }
  </style>
</head>
<body>
<BR>
<BR><BR><BR><BR><BR>
<CENTER>
  <div class="container">
    <h1>Login</h1>
    <form>
      <div class="form-group">
        <label for="email"  required>Email</label>
        <input type="text" id="email" name="email" placeholder="Enter your email">
      </div>
      <div class="form-group">
        <label for="password"  required>Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password">
      </div>
<BUTTON type="button"><A HREF="">LOGIN</A></BUTTON>
      <div class="register">Don't have an account? <a href="registration.html">Register</a></div>
    </form>
  </div>
</CENTER>
</body>
</html>
